architecture:
  class_path: src.e5.model.ResidualCNN
  width: 48
  parameters: 44738
  layers:
  - Conv2d(7,48,3,padding=1)
  - ReLU
  - Conv2d(48,48,3,padding=1)
  - ReLU
  - Conv2d(48,48,3,padding=1)
  - ReLU
  - Conv2d(48,2,1)
  active_mask_output: true
optimizer:
  name: Adam
  learning_rate: 0.001
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  weight_decay: 1.0e-05
  gradient_clip_norm: 1.0
scheduler: null
batch_size: 16
max_epochs: 20
early_stopping:
  patience: 4
  absolute_min_delta: 1.0e-06
  metric: mean full-view normalized residual MSE on V-design (partial views are train-only)
  improvement: validation_loss < previous_best - 1e-6
initialization: torch Conv2d defaults, final Conv2d weights/bias zero; torch.manual_seed(seed)
train_frames: 4096
selection_frames: 1536
training_distribution:
  family: A
  snr_db_uniform:
  - -5
  - 0
  - 5
  - 10
  - 15
  - 20
  - 25
  modulation_uniform:
  - QPSK
  - 16QAM
  stride_uniform:
  - 4
  - 8
  - 16
  burst_uniform:
  - none
  - short10
  - long10
  - long20
views: one full plus one partial per frame; index % 8 cycles fraction .25,.5 and random,interleaved,block,geometry;
  unchanged across epochs
data_policy: fixed E6 train/V-design realizations; no calibration/test or new training
order: NumPy PCG64(training seed) epoch permutations; saved optimizer/RNG resumable
  state
deterministic_torch: true
cudnn_benchmark: false
