cpu: Intel(R) Core(TM) i7-8750H CPU @ 2.20GHz
native_threads: 1
torch_threads: 1
torch_interop_threads: 1
device: cpu
batch_size: 1
residual_seed: 5101
helena_seed: 5101
frames: 128
warmup_per_method_mode: 10
timed_repetitions: 3
clock: time.perf_counter
synchronization: CPU synchronous completion; no GPU timing claim
order: PCG64(71992) permutation of methods within each frame/repetition/mode
eligible_matched_coverage:
- 0.25
- 0.5
descriptive_only_coverage:
- 0.75
threshold: score-only lexicographic cutoff accepting floor(a*n) on cost panel; same
  independent tie-key for methods; not deployment calibration
accuracy: same score rank coverage on all8192 P0-GATES frames seed5101; paired harm/use
  comparability at each eligible coverage
boundaries:
  C_val: FFT grid to selected estimate including candidate construction, score, G2
    partial validation and all-pilot refit
  C_rx: 'raw received CP buffer to hard bits: CP removal, FFT, all C_val work, equalization/detection'
  C_inc: C_rx minus measured branch replay with identical accepted/rejected decision
    but no score calculation; signed, not standalone savings
warm_state: models/statistics loaded, fixed geometry cached; separately report measured
  setup cold-code/cache-empty cost, no OS-cache-cold claim
memory: sample process RSS every .01s; resident model bytes; CUDA allocation/reservation
  zero for CPU timing; training VRAM from preserved E6 metadata
no_time_trimming: true
comparison:
  validation_ratio_upper: 0.9
  harm_joint_margin: 0.005
  harm_conditional_margin: .005 / target_coverage
  useful_joint_margin: -0.01
  receiver_jitter_seconds: 0.0005333199835149571
  receiver_jitter_source: outputs/e6/thread_corrected/timing/V-assess.json
development_timing_keys:
- label
- binding
- partition
- device
- threads
- batch_size
- warmups
- repetitions
- model_seed
- dtype
- frames
- rows
- ledgers
- summaries
- cutoffs
- cold_model_seconds
- geometry_setup_seconds
- setup_amortization_frames
- peak_sampled_rss_bytes
- parameter_bytes
- statistics_bytes
- allocated_vram
- reserved_vram
- resolution
- cutoff_scope
