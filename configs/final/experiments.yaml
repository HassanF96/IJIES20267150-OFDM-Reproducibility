sampling: fixed counts; no event-driven extension; no favorable-result stopping; checkpoint/resume
  same IDs only
failure_examples: for each experiment/cell/seed, smallest lexicographic frame ID for
  G3-hard harmful acceptance and useful rejection; empty category explicitly NA; no
  best-looking replacement
p2:
  status: OPTIONAL_NOT_SCHEDULED
  items:
  - independent Sionna component cross-check
  - extended failure illustrations
  excluded_methods:
  - G4 not adopted
  - MoE-CE not adopted
  rule: cannot introduce a new estimator/claim using final data; any future method
    is a separate study
bits_per_frame:
  QPSK:
    '4': 1152
    '8': 1344
    '16': 1440
  QAM16:
    '8': 2688
primary_metric: equal-seed mean matched-IID joint harmful-acceptance risk of the selected
  G3-hard policy; per-seed values mandatory
primary_success: formal calibration certificate AND independent useful-acceptance
  criteria; reject-all is failure to establish useful reliability
